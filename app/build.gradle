plugins {
    id "com.android.application" version "8.9.2"
}

// Release signing credentials are supplied out-of-band, never committed.
def releaseStorePath = System.getenv("COSTPHONE_KEYSTORE_PATH")
def releaseStorePassword = System.getenv("COSTPHONE_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("COSTPHONE_KEY_ALIAS")
def releaseKeyPassword = System.getenv("COSTPHONE_KEY_PASSWORD")
def hasOriginalSigningKey =
        [releaseStorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
                .every { it != null && !it.trim().isEmpty() } &&
        new File(releaseStorePath).isFile()

android {
    namespace "com.accessdroid.termux"
    compileSdk 36

    defaultConfig {
        applicationId "com.accessdroid.termux"
        minSdk 24
        targetSdk 34
        versionCode 12
        versionName "1.3"
    }

    sourceSets {
        main {
            manifest.srcFile "AndroidManifest.xml"
            java {
                srcDirs = ["src"]
                include "AccessibilityServiceImpl.java", "SettingsActivity.java", "CostPhoneShizukuService.java"
            }
            aidl.srcDirs = ["aidl"]
            res.srcDirs = ["res"]
        }
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Do not silently generate a new release identity. Release signing exists only
    // when the caller supplies the original keystore and its credentials.
    if (hasOriginalSigningKey) {
        signingConfigs {
            costPhoneOriginal {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.costPhoneOriginal
                minifyEnabled false
            }
        }
    } else {
        buildTypes {
            release {
                minifyEnabled false
            }
        }
    }
}

dependencies {
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
}
