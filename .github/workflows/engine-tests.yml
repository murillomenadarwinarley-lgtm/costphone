name: CostPhone Engine tests

on:
  push:
    branches:
      - "engine/**"
    paths:
      - "engine/**"
      - "skill/costphone-engine/**"
      - "skill/costphone-pc/**"
      - "termux/install-costphone-engine.sh"
      - ".github/workflows/engine-tests.yml"
      - "pc/windows/**"
      - "docs/pc-windows.md"
      - "docs/pc-native-windows.md"
      - "README.md"
  pull_request:
    branches:
      - mi-cambio
    paths:
      - "engine/**"
      - "skill/costphone-engine/**"
      - "skill/costphone-pc/**"
      - "termux/install-costphone-engine.sh"
      - ".github/workflows/engine-tests.yml"
      - "pc/windows/**"
      - "docs/pc-windows.md"
      - "docs/pc-native-windows.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax checks
        run: |
          python -m py_compile engine/costphone_engine.py engine/mcp_server.py engine/test_engine.py engine/windows_engine.py engine/windows_mcp_server.py engine/test_windows_engine.py
          bash -n termux/install-costphone-engine.sh

      - name: Validate Windows setup scripts syntax (PowerShell)
        shell: pwsh
        run: |
          $files = @("pc/windows/setup-costphone.ps1", "pc/windows/install-costphone-pc.ps1")
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }
          Write-Host "PowerShell syntax OK"

      - name: Offline unit tests
        run: python -m unittest discover -s engine -p 'test_*.py' -v

      - name: Installer smoke test in an isolated HOME
        run: |
          set -euo pipefail
          test_home="$(mktemp -d)"
          trap 'rm -rf "$test_home"' EXIT
          HOME="$test_home" COSTPHONE_ENGINE_BASE_URL="file://$GITHUB_WORKSPACE" bash termux/install-costphone-engine.sh
          test -x "$test_home/bin/costphone-engine"
          test -x "$test_home/bin/costphone-mcp"
          test -f "$test_home/.config/opencode/skills/costphone-engine/SKILL.md"
          test ! -e "$test_home/.config/opencode/opencode.json"
          HOME="$test_home" bash "$test_home/bin/costphone-engine" --version
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}' | HOME="$test_home" bash "$test_home/bin/costphone-mcp" > "$test_home/mcp.jsonl"
          python -c 'import json,sys; r=json.loads(open(sys.argv[1], encoding="utf-8").readline()); assert r["result"]["serverInfo"]["name"] == "costphone-engine"' "$test_home/mcp.jsonl"

      - name: MCP stdio protocol smoke test
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | python engine/mcp_server.py > /tmp/costphone-mcp.jsonl
          python - <<'PY'
          import json
          with open("/tmp/costphone-mcp.jsonl", encoding="utf-8") as fh:
              replies = [json.loads(line) for line in fh if line.strip()]
          assert len(replies) == 2, replies
          assert replies[0]["result"]["serverInfo"]["name"] == "costphone-engine"
          names = {tool["name"] for tool in replies[1]["result"]["tools"]}
          assert names == {"phone_inspect", "phone_launch", "phone_validate_plan", "phone_run_plan", "phone_resume_plan", "phone_get_run"}, names
          print("MCP handshake and tool listing passed.")
          PY
      - name: Native Windows MCP protocol smoke test
        run: |
          python - <<'PY' | python engine/windows_mcp_server.py > /tmp/costphone-pc-mcp.jsonl
          import json
          print(json.dumps({"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2024-11-05"}}))
          print(json.dumps({"jsonrpc": "2.0", "id": 2, "method": "tools/list", "params": {}}))
          PY
          python - <<'PY'
          import json
          with open("/tmp/costphone-pc-mcp.jsonl", encoding="utf-8") as fh:
              replies = [json.loads(line) for line in fh if line.strip()]
          assert len(replies) == 2, replies
          assert replies[0]["result"]["serverInfo"]["name"] == "costphone-pc"
          names = {tool["name"] for tool in replies[1]["result"]["tools"]}
          expected = {"desktop_inspect", "desktop_screenshot", "desktop_launch_app", "desktop_open_url", "desktop_click", "desktop_scroll", "desktop_drag", "desktop_type_text", "desktop_press_key", "desktop_inspect_controls", "desktop_click_control", "desktop_double_click_control", "desktop_set_control_text", "desktop_set_control_checked"}
          assert names == expected, names
          print("Native Windows MCP handshake and tool listing passed.")
          PY
  windows-native-package-check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native Windows dependencies
        run: python -m pip install --disable-pip-version-check -r engine/requirements-windows.txt

      - name: Compile and import Windows engine dependencies
        run: |
          python -m py_compile engine/windows_engine.py engine/windows_mcp_server.py engine/test_windows_engine.py
          python -c "import pyautogui, PIL, pyperclip, pywinauto; print('Windows automation dependencies imported successfully.')"

