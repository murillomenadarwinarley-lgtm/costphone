name: Build CostPhone APK

on:
  push:
    branches:
      - ui/premium-dashboard
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android platform and build tools
        shell: bash
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"
          if [[ ! -e "$HOME/android-sdk" ]]; then ln -s "$SDK_ROOT" "$HOME/android-sdk"; fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Validate shell and agent tooling
        shell: bash
        run: |
          for script in install.sh termux/amctl app/build.sh; do
            bash -n "$script"
          done
          python3 -m py_compile termux/amctl-snap.py
          test -s skill/phone-control/SKILL.md

      - name: Compile and package
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK package and signature
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          aapt2 dump badging "$APK" | grep -E 'package:|application-label:|launchable-activity:'
          apksigner verify "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: costphone-ui-preview-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
