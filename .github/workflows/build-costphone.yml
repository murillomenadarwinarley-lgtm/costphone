name: Build CostPhone APK

on:
  push:
    branches:
      - ui/premium-dashboard
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Android app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform and build tools
        shell: bash
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"
          ln -s "$SDK_ROOT" "$HOME/android-sdk"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Build and sign APK
        working-directory: app
        shell: bash
        run: bash build.sh

      - name: Verify APK package and launcher activity
        working-directory: app
        shell: bash
        run: |
          test -s build/CostPhone.apk
          aapt2 dump badging build/CostPhone.apk | grep -E 'package:|application-label:|launchable-activity:'
          java -jar "$HOME/android-sdk/build-tools/36.0.0/lib/apksigner.jar" verify build/CostPhone.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: costphone-ui-preview-apk
          path: app/build/CostPhone.apk
          if-no-files-found: error
          retention-days: 7
